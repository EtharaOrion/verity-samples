# Derivation record. PRIVATE CARRIER.
#
# Holds only what the bundle cannot reconstruct from itself or from the pinned harness. Workload
# targets, budgets, metric names, and the registry are readable from the workload class at the pinned
# commit. Optimizer settings are readable from the two submission files. Budget, perturbations, and
# anchors are in the run specification. None of that is copied here.
#
# recompute.py reads this file and derives every generated artifact from it in one pass.
#
# Restricted YAML subset on purpose: nested maps, lists, scalars, and folded blocks only.
#
# Shakedown bundle. Never a corpus member.

